<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Báo cáo kết quả ngày · NEWCOLOR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
 *{box-sizing:border-box} html,body{overflow-x:hidden}
 body{margin:0;background:#eef1f4;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1b1f24;padding-bottom:110px}
 .dk{position:sticky;top:0;z-index:5;background:#fff;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
 .dk h1{margin:0 0 8px;font-size:18px}
 .hang{display:flex;gap:8px;align-items:center}
 .hang input{flex:1;font-size:16px;padding:9px;border:1px solid #c9ced6;border-radius:8px}
 .hang button{font-size:15px;padding:10px 12px;border:1px solid #c9ced6;background:#fff;border-radius:8px}
 #gui{display:block;width:100%;margin-top:10px;font-size:19px;font-weight:800;padding:15px;border:0;border-radius:12px;background:#0068ff;color:#fff}
 #gui:disabled{background:#9aa3ad}
 #tb{margin:10px 14px;font-size:15px;line-height:1.45}
 .loi{color:#b3261e;font-weight:700}
 .xem img{display:block;width:100%;max-width:420px;margin:10px auto;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
 /* ---- khuôn ảnh (dựng ngoài màn hình rồi chụp) ---- */
 #khuon{position:absolute;left:-10000px;top:0}
 .anh{width:400px;background:#eef1f4;padding-bottom:6px}
 .top{background:#0b4f8a;color:#fff;padding:12px 14px}.top h2{margin:0;font-size:19px}.top div{font-size:14px;opacity:.92;margin-top:3px}
 .the{background:#fff;margin:10px;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1)}
 .dau{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#e8f0f8;padding:9px 12px;font-size:17px}
 .dau b{min-width:0}
 .dau span{font-size:15px;color:#0b4f8a;font-weight:700;white-space:nowrap}
 .dc{padding:6px 12px 2px;font-size:14px;color:#444}
 .cho{margin:6px 12px 0;font-size:12.5px;color:#a66a00;font-weight:700}
 table{width:100%;border-collapse:collapse;font-size:15.5px}
 th{width:96px;text-align:left;vertical-align:top;color:#5d6b7c;font-weight:600;font-size:13px;padding:6px 6px 6px 12px;border-top:1px solid #eef1f4}
 td{padding:6px 12px 6px 4px;border-top:1px solid #eef1f4;font-weight:600;line-height:1.35;word-break:break-word}
 td.tr,.trd,.dau span.trd{color:#c62828;background:#fdecea;font-weight:800;letter-spacing:.5px}
 .chan{text-align:center;font-size:12px;color:#888;padding:4px 0 6px}
 .che{display:flex;gap:6px;margin-bottom:8px}.che button{flex:1;font-size:15px;font-weight:700;padding:9px;border:1px solid #c9ced6;background:#fff;border-radius:8px;color:#0b4f8a}
 .che button.on{background:#0b4f8a;color:#fff;border-color:#0b4f8a}
 .tt{font-size:13px;font-weight:800;padding:2px 8px;border-radius:10px;white-space:nowrap}
 .tt.ok{background:#e6f4ea;color:#1e7b34}.tt.chua{background:#fdecea;color:#c62828}.tt.cho{background:#eef1f4;color:#5d6b7c}
 #nhap{display:none;margin:10px 14px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
 #nhap h3{margin:0 0 8px;font-size:16px;color:#0b4f8a}
 #nhap label{display:block;font-size:13px;font-weight:700;color:#5d6b7c;margin:8px 0 3px}
 #nhap input,#nhap textarea{width:100%;font-size:16px;padding:9px;border:1px solid #c9ced6;border-radius:8px;font-family:inherit}
 #nhap textarea{min-height:60px}
 .nut2{display:flex;gap:8px;margin-top:10px}.nut2 button{flex:1;font-size:16px;font-weight:800;padding:12px;border:0;border-radius:10px;background:#1e7b34;color:#fff}
 .nut2 button.phu{background:#eef1f4;color:#1b1f24}
 .viec{display:flex;gap:8px;align-items:flex-start;border-top:1px solid #eef1f4;padding:8px 0;font-size:15px}
 .kp{margin:0 10px 10px;border:1px solid #d6e2ef;border-radius:8px;overflow:hidden}
 .kp .kt{background:#f3f7fb;color:#0b4f8a;font-size:12.5px;font-weight:800;padding:5px 8px}
 .kp .kt.trd{color:#c62828;background:#fdecea}
 .kp .kd{display:flex;gap:6px;padding:5px 8px;border-top:1px solid #eef1f4;font-size:14.5px;line-height:1.35}
 .kp .kd i{font-style:normal;color:#5d6b7c;font-size:12.5px;min-width:96px;max-width:96px}
 .kp .kd b{word-break:break-word}
 .moi{margin:6px 12px 0;padding:5px 8px;border-radius:6px;font-size:13.5px;font-weight:800}
 .moi.m1{background:#fff4d6;color:#8a5a00}.moi.m2{background:#eef1f4;color:#36506b}
 .viec div{flex:1}.viec small{color:#5d6b7c}.viec button{font-size:13px;padding:6px 9px;border:1px solid #c9ced6;background:#fff;border-radius:8px}
</style></head><body>
<div class="dk">
 <h1><span id="tieuDe">📄 Báo cáo kết quả ngày</span> · <span id="tenNV">…</span></h1>
 <div class="che"><button id="cheBC">📄 BÁO CÁO KẾT QUẢ NGÀY</button><button id="cheKH">🗓 LẬP KẾ HOẠCH NGÀY</button></div>
 <div class="hang"><button id="truoc">‹</button><input id="ngay" type="date"><button id="sau">›</button><button id="lai">↻</button></div>
 <button id="gui" disabled>📤 GỬI ZALO</button>
</div>
<div id="nhap">
 <h3 id="nhapTD">➕ Thêm việc</h3>
 <div id="dsViec"></div>
 <label>1. TÊN CÔNG VIỆC (chọn hoặc tự gõ)</label><input id="fTen" list="dlTen" autocomplete="off">
 <label>GẶP AI (khách / công trình — chọn hoặc tự gõ)</label><input id="fKhach" list="dlKhach" autocomplete="off">
 <label>2. NỘI DUNG CÔNG VIỆC CỤ THỂ</label><textarea id="fNd"></textarea>
 <label>3. MỤC TIÊU ĐẠT ĐƯỢC GÌ (chọn hoặc tự gõ)</label><input id="fMt" list="dlMt" autocomplete="off">
 <div id="oKq"><label>KẾT QUẢ (chỉ ghi khi chưa làm được, hoặc việc không gặp khách)</label><input id="fKq" list="dlKq" autocomplete="off"></div>
 <div class="nut2"><button id="luuViec">💾 LƯU VIỆC</button><button id="huyViec" class="phu">Làm mới</button></div>
 <datalist id="dlTen"></datalist><datalist id="dlKhach"></datalist><datalist id="dlMt"></datalist><datalist id="dlKq"></datalist>
</div>
<div id="tb">Đang tải báo cáo…</div>
<div class="xem" id="xem"></div>
<div id="khuon"></div>
<script>
 var EXEC = "https://script.google.com/macros/s/AKfycbwjetdjCI7ZxCbl6Ub4LIIKeLVGmNncSAl91BDBYWv6hTibvowtJ_S1oybOz3SoZAhmMg/exec", CTY = "NEWCOLOR", MOI_ANH = 2, TEP = [], DANG = 0;
 function $(i) { return document.getElementById(i); }
 function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
 function luu(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; } }
 // link riêng ?t=… -> nhớ trong máy (mở bằng biểu tượng màn hình chính vẫn chạy)
 var T = (location.search.match(/[?&]t=([0-9a-f]{32})/) || [])[1] || '';
 if (T) luu('tBC', T); else T = luu('tBC');
 function homNay() { var d = new Date(Date.now() + 7 * 3600000); return d.toISOString().slice(0, 10); }
 function dd(s) { var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
 function doiNgay(n) { var d = new Date($('ngay').value + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); $('ngay').value = d.toISOString().slice(0, 10); tai(); }
 // 10/11: 2 chế độ — BÁO CÁO NGÀY (kết quả theo lượt ghé) · KẾ HOẠCH CÔNG VIỆC (NV tự lập trên app). ?kh=1 mở thẳng kế hoạch; ?ngay=yyyy-mm-dd chọn ngày.
 var KH = /[?&]kh=1/.test(location.search), NGAY_URL = (location.search.match(/[?&]ngay=(\d{4}-\d{2}-\d{2})/) || [])[1] || '';
 function ngayMai() { var d = new Date(Date.now() + 31 * 3600000); return d.toISOString().slice(0, 10); }
 function macDinh() { return KH ? (new Date(Date.now() + 7 * 3600000).getUTCHours() >= 12 ? ngayMai() : homNay()) : homNay(); }
 function doiChe(kh) { KH = kh; $('cheKH').className = kh ? 'on' : ''; $('cheBC').className = kh ? '' : 'on'; $('tieuDe').textContent = kh ? '🗓 Lập kế hoạch ngày' : '📄 Báo cáo kết quả ngày'; $('nhap').style.display = kh ? 'block' : 'none'; }
 // ---- 10/11: nhập KẾ HOẠCH CÔNG VIỆC ngay trên trang (ô nào cũng chọn được hoặc tự gõ)
 var DS_TEN = ['GẶP ĐẠI LÝ ĐANG LẤY HÀNG', 'ĐI CHÀO CÔNG TRÌNH CÙNG ĐẠI LÝ', 'GẶP ĐẠI LÝ LẤY GIẢM', 'CHĂM KHÁCH TIỀM NĂNG / MỤC TIÊU', 'KHÁM PHÁ KHÁCH MỚI', 'THEO DÕI CÔNG TRÌNH', 'THU TIỀN / ĐỐI CHIẾU CÔNG NỢ', 'GIAO HÀNG / MẪU THỬ', 'VIỆC NỘI BỘ / HỌP'];
 var DS_MT = {
   'GẶP ĐẠI LÝ ĐANG LẤY HÀNG': ['BIẾT THÁNG NÀY MẤY CT · ĐÃ NHẬN MẤY CT · MẤY CT SƠN TRONG THÁNG', 'HẸN NGÀY ĐI CHÀO CT CÙNG ĐẠI LÝ', 'BIẾT KHÓ KHĂN CỦA ĐẠI LÝ'],
   'ĐI CHÀO CÔNG TRÌNH CÙNG ĐẠI LÝ': ['CHÀO ĐƯỢC CT', 'NHẬN ĐƯỢC CT'],
   'GẶP ĐẠI LÝ LẤY GIẢM': ['TÌM RA LÝ DO LẤY GIẢM', 'HẸN LẠI NGÀY LẤY HÀNG'],
   'CHĂM KHÁCH TIỀM NĂNG / MỤC TIÊU': ['KHÁM PHÁ THÊM THÔNG TIN', 'TẠO QUAN HỆ', 'MỜI THĂM NHÀ MÁY', 'HẸN ĐI CHÀO CT', 'TÌM NỖI ĐAU CỦA KHÁCH', 'LẤY ĐƠN THỬ'],
   'KHÁM PHÁ KHÁCH MỚI': ['KHÁM PHÁ ĐỦ THÔNG TIN KHÁCH', 'XIN SĐT + HẸN LẦN SAU'],
   'THU TIỀN / ĐỐI CHIẾU CÔNG NỢ': ['THU ĐƯỢC TIỀN', 'KHÁCH XÁC NHẬN SỐ NỢ']
 };
 var DS_KQ = ['ĐÃ LÀM, ĐẠT', 'ĐÃ LÀM, CHƯA ĐẠT', 'KHÁCH HẸN LẠI', 'KHÔNG GẶP ĐƯỢC', 'ĐỔI TUYẾN', 'VIỆC GẤP', 'HẾT GIỜ'];
 var SUA = '', VIEC = [];
 function dl(id, ds) { $(id).innerHTML = ds.map(function (x) { return '<option value="' + esc(x) + '">'; }).join(''); }
 function goiYMt() { var t = $('fTen').value.trim().toUpperCase(), ds = DS_MT[t]; if (!ds) { ds = []; Object.keys(DS_MT).forEach(function (k) { ds = ds.concat(DS_MT[k]); }); } dl('dlMt', ds); }
 dl('dlTen', DS_TEN); dl('dlKq', DS_KQ); goiYMt();
 $('fTen').oninput = goiYMt;
 function lamMoi() { SUA = ''; ['fTen', 'fKhach', 'fNd', 'fMt', 'fKq'].forEach(function (i) { $(i).value = ''; }); $('nhapTD').textContent = '➕ Thêm việc ngày ' + dd($('ngay').value); $('luuViec').textContent = '💾 LƯU VIỆC'; goiYMt(); }
 $('huyViec').onclick = lamMoi;
 function goi(than, xong) {
   fetch(EXEC, { method: 'POST', body: JSON.stringify(than), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow' })
     .then(function (r) { return r.json(); }).then(xong, function () { xong({ ok: false, loi: 'Mạng yếu, chưa gửi được. Thử lại.' }); });
 }
 $('luuViec').onclick = function () {
   var dong = { ma: SUA, ngay: $('ngay').value, ten: $('fTen').value, khach: $('fKhach').value, nd: $('fNd').value, mt: $('fMt').value, kq: $('fKq').value };
   if (!dong.ten.trim() && !dong.nd.trim()) { alert('Ghi TÊN CÔNG VIỆC hoặc NỘI DUNG.'); return; }
   $('luuViec').disabled = true; $('luuViec').textContent = 'Đang lưu…';
   goi({ kenh: 'WEB', hanhDong: 'WEB_KHCV', t: T, lam: 'LUU', dong: dong }, function (k) {
     $('luuViec').disabled = false;
     if (!k || !k.ok) { $('luuViec').textContent = '💾 LƯU VIỆC'; alert((k && k.loi) || 'Chưa lưu được.'); return; }
     lamMoi(); tai();
   });
 };
 function suaViec(i) { var o = VIEC[i]; SUA = o.ma; $('fTen').value = o.ten; $('fKhach').value = o.khach; $('fNd').value = o.nd; $('fMt').value = o.mt; $('fKq').value = o.kq; goiYMt();
   $('nhapTD').textContent = '✏️ Sửa việc ' + (i + 1); $('luuViec').textContent = '💾 LƯU SỬA'; $('nhap').scrollIntoView(); }
 function xoaViec(i) { var o = VIEC[i]; if (!confirm('Xoá việc "' + (o.ten || o.nd) + '"?')) return;
   goi({ kenh: 'WEB', hanhDong: 'WEB_KHCV', t: T, lam: 'XOA', dong: { ma: o.ma } }, function (k) { if (!k || !k.ok) { alert((k && k.loi) || 'Chưa xoá được.'); return; } lamMoi(); tai(); }); }
 $('cheBC').onclick = function () { doiChe(false); $('ngay').value = homNay(); tai(); };
 $('cheKH').onclick = function () { doiChe(true); $('ngay').value = macDinh(); tai(); };
 doiChe(KH);
 $('ngay').value = NGAY_URL || macDinh();
 $('truoc').onclick = function () { doiNgay(-1); }; $('sau').onclick = function () { doiNgay(1); };
 $('lai').onclick = tai; $('ngay').onchange = tai;

 /** 1 thẻ khách. Ô trống tô đỏ; gặp công trình thì không bắt các ô của đại lý (và ngược lại). */
 function the(o, i) {
   var laCT = !o['TÊN ĐẠI LÝ'] && !!o['TÊN CÔNG TRÌNH'];
   // 10/11 Sếp chốt: gặp ĐẠI LÝ đang lấy hàng (đánh giá ĐẠI LÝ / ĐẠI LÝ MỚI / CỘNG TÁC VIÊN) thì app đã ẩn Tín hiệu mua + Băn khoăn → không tính trống
   var laDL = !laCT && /(^|,\s*)(ĐẠI LÝ|ĐẠI LÝ MỚI|CỘNG TÁC VIÊN)(\s*,|$)/.test(String(o['ĐÁNH GIÁ ĐẠI LÝ'] || '').toUpperCase());
   var muc = (laCT ? [['TIẾN ĐỘ CÔNG TRÌNH', 'Tiến độ CT'], ['ĐÁNH GIÁ CÔNG TRÌNH', 'Đánh giá CT']]
                   : [['NGÀNH NGHỀ ĐẠI LÝ', 'Ngành nghề'], ['ĐÁNH GIÁ ĐẠI LÝ', 'Đánh giá']])
     .concat([['VẤN ĐỀ', 'Vấn đề'], ['MỤC ĐÍCH GHÉ THĂM', 'Mục đích ghé']])
     .concat(laDL ? [] : [['TÍN HIỆU MUA', 'Tín hiệu mua'], ['BĂN KHOĂN CỦA KH', 'Băn khoăn KH']])
     .concat([['VIỆC LẦN SAU', 'Việc lần sau'], ['NGÀY HẸN LẠI', 'Hẹn lại']]);
   var trong = 0;
   var dong = muc.map(function (m) { var v = o[m[0]]; if (!v) trong++; return '<tr><th>' + m[1] + '</th><td class="' + (v ? '' : 'tr') + '">' + (v ? esc(v) : 'TRỐNG') + '</td></tr>'; }).join('');
   var dc = [o['THÔN'], o['XÃ'], o['HUYỆN']].filter(Boolean).join(' – ');
   if (!dc) trong++;
   if (!o['SỐ ĐIỆN THOẠI'] && !laCT) trong++;
   var html = '<div class="the"><div class="dau"><b>' + i + '. ' + esc(o['TÊN ĐẠI LÝ'] || o['TÊN CÔNG TRÌNH'] || '(chưa ghi tên)') + '</b>' +
     '<span' + (o['SỐ ĐIỆN THOẠI'] || laCT ? '' : ' class="trd"') + '>' + esc(o['SỐ ĐIỆN THOẠI'] || (laCT ? '' : 'TRỐNG SĐT')) + '</span></div>' +
     '<div class="dc">📍 ' + (dc ? esc(dc) : '<span class="trd">TRỐNG ĐỊA CHỈ</span>') + '</div>' +
     (o.nguon === 'APP' ? (o.tt === 'LỖI' ? '<div class="cho" style="color:#c62828">⚠ App báo LỖI khi chuyển vào NHẬT KÝ – nhắn quản lý</div>' : '<div class="cho">⏳ Vừa lưu trên app, đang chờ vào NHẬT KÝ</div>') : '') +
     (o.moi === 'MOI' ? '<div class="moi m1">KHÁCH MỚI · GẶP LẦN ĐẦU · gửi thông tin khám phá lên nhóm Zalo</div>'
       : o.moi === 'THANG' ? '<div class="moi m1">GẶP LẦN ĐẦU TRONG THÁNG · gửi thông tin khám phá lên nhóm Zalo</div>' : '') +
     '<table>' + dong + '</table>' + kpHtml(o, laCT, laDL) + '</div>';
   return { html: html, trong: trong };
 }
 // 11/11 Chị: hiện THÔNG TIN KHÁM PHÁ NV điền trong lượt này (mục · ghi gì). Khách chưa là đại lý mà không điền gì -> báo đỏ.
 function kpHtml(o, laCT, laDL) {
   if (laCT) return '';
   var kp = o.kp || [], chuaGap = /CHƯA GẶP ĐƯỢC/.test(String(o['ĐÁNH GIÁ ĐẠI LÝ'] || '').toUpperCase());
   if (!kp.length) return (laDL || chuaGap || o.nguon !== 'APP' && !o.ma) ? '' : '<div class="kp"><div class="kt trd">THÔNG TIN KHÁM PHÁ LƯỢT NÀY: KHÔNG ĐIỀN</div></div>';
   // 16/11 Chị: hiện nguyên văn NV ghi (kể cả "k"); có câu ghi cho có -> dòng đỏ LÀM ĐỐI PHÓ
   var dp = kp.filter(function (x) { return x.dp; }).length;
   return '<div class="kp">' + (dp ? '<div class="kt trd">THÔNG TIN KHÁM PHÁ LÀM ĐỐI PHÓ (' + dp + '/' + kp.length + ' câu ghi cho có)</div>' : '') +
     '<div class="kt">THÔNG TIN KHÁM PHÁ LƯỢT NÀY (' + kp.length + ' mục)</div>' +
     kp.map(function (x) { return '<div class="kd"><i>' + esc(x.muc) + '</i><b' + (x.dp ? ' style="color:#c62828"' : '') + '>' + esc(x.gt) + '</b></div>'; }).join('') + '</div>';
 }

 var CHO_HEN = 0, CHO_LAN = 0, THIEU = [], LY_BO = ['BẤM NHẦM KHÁCH', 'CHECK-IN THỬ', 'BẤM TRÙNG LƯỢT'];
 // tự kiểm lại; đang chọn lý do bỏ lượt thì chờ thêm, không tải lại làm mất lựa chọn
 function kiemLai() {
   if (KH) return;
   var dangChon = [].some.call(document.querySelectorAll('select[id^="lyBo"]'), function (s) { return !!s.value || document.activeElement === s; });
   if (dangChon) { CHO_HEN = setTimeout(kiemLai, 15000); return; }
   tai(true);
 }
 // 26/11: NV tự bỏ lượt check-in nhầm (có lý do; máy ghi sổ + in đỏ trên ảnh)
 function boLuot(i) {
   var x = THIEU[i], ly = $('lyBo' + i).value;
   if (!x || !x.ma) return;
   if (!ly) { alert('Chọn lý do trước.'); return; }
   if (!confirm('Bỏ lượt check-in ' + x.gio + ' · ' + x.ten + ' (lý do: ' + ly + ')?\nẢnh gửi nhóm sẽ ghi rõ bạn đã tự bỏ lượt này.')) return;
   goi({ kenh: 'WEB', hanhDong: 'WEB_BO_CK', t: T, maCK: x.ma, lyDo: ly }, function (k) {
     if (!k || !k.ok) { alert((k && k.loi) || 'Chưa bỏ được, thử lại.'); return; }
     tai();
   });
 }
 function tai(tuDong) {
   clearTimeout(CHO_HEN); if (tuDong !== true) CHO_LAN = 0;
   var ngay = $('ngay').value || homNay(), lan = ++DANG;
   TEP = []; $('gui').disabled = true; $('gui').textContent = '📤 GỬI ZALO'; $('xem').innerHTML = '';
   if (!T) { $('tb').innerHTML = '<span class="loi">Chưa có link riêng. Mở đúng link quản lý gửi qua Zalo (có ?t=…) một lần.</span>'; return; }
   $('tb').textContent = 'Đang tải ' + (KH ? 'kế hoạch' : 'báo cáo') + ' ngày ' + dd(ngay) + '…';
   fetch(EXEC, { method: 'POST', body: JSON.stringify({ kenh: 'WEB', hanhDong: 'WEB_BAOCAO', t: T, ngay: ngay, kh: KH }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow' })
     .then(function (r) { return r.json(); })
     .then(function (d) { if (lan === DANG) ve(d, ngay); }, function () { if (lan === DANG) $('tb').innerHTML = '<span class="loi">Mạng yếu, chưa tải được. Bấm ↻ để thử lại.</span>'; });
 }

 function ve(d, ngay) {
   if (!d || !d.ok) { $('tb').innerHTML = '<span class="loi">' + esc((d && d.loi) || 'Lỗi tạm thời, bấm ↻ thử lại.') + '</span>'; return; }
   $('tenNV').textContent = d.ten;
   if (KH) return veKH(d, ngay);
   var ds = d.ds || [];
   var dem = d.dem || null;                                         // 23/10: dòng đối chiếu check-in ↔ báo cáo
   var doiChieu = dem ? 'Check-in: ' + dem.ck + ' · Báo cáo: ' + ds.length + (dem.chuaBC ? ' · CHƯA BÁO CÁO: ' + dem.chuaBC : ' · đủ') : '';
   var dk = d.dcKH;                                                 // 10/11: đối chiếu với KẾ HOẠCH CÔNG VIỆC của ngày
   if (dk && dk.tong) doiChieu += (doiChieu ? '<br>' : '') + 'Kế hoạch: ' + dk.tong + ' việc · đã làm ' + dk.daLam + ' · chưa làm ' + dk.chua + ' · phát sinh ' + dk.phatSinh.length;
   else doiChieu += (doiChieu ? '<br>' : '') + 'CHƯA LẬP KẾ HOẠCH NGÀY';
   // 26/11: lượt trùng máy tự bỏ qua + lượt NV tự bỏ (in đỏ) — để quản lý nhìn thấy trên ảnh
   if (dem && dem.trung && dem.trung.length) doiChieu += '<br>Lượt check-in trùng (máy bỏ qua): ' + dem.trung.map(esc).join(', ');
   if (dem && dem.tuBo && dem.tuBo.length) doiChieu += '<br><span style="background:#ffe08a;color:#b71c1c;padding:1px 5px;border-radius:4px">TỰ BỎ ' + dem.tuBo.length + ' lượt check-in: ' +
     dem.tuBo.map(function (x) { return esc(x.gio + ' · ' + x.ten + ' — ' + x.lyDo); }).join('; ') + '</span>';
   // 26/11/2026 Chị: còn lượt check-in chưa có báo cáo trên máy thì CHƯA cho gửi (tránh ảnh thiếu việc); trang tự kiểm lại mỗi 30 giây
   if (dem && dem.thieu && dem.thieu.length) {
     var lanCho = ++CHO_LAN;
     THIEU = dem.thieu;
     $('tb').innerHTML = '<div class="loi"><b>⏳ CHƯA GỬI ĐƯỢC — còn ' + dem.thieu.length + ' lượt check-in chưa thấy báo cáo trên máy:</b></div>' +
       dem.thieu.map(function (x, i) {
         if (typeof x === 'string') return '<div class="loi">' + esc(x) + '</div>';
         return '<div class="viec"><div class="loi"><b>' + esc(x.gio + ' · ' + x.ten) + '</b></div>' +
           '<select id="lyBo' + i + '"><option value="">Lượt này nhầm? chọn lý do…</option>' + LY_BO.map(function (l) { return '<option>' + l + '</option>'; }).join('') + '</select>' +
           '<button onclick="boLuot(' + i + ')">Bỏ lượt</button></div>';
       }).join('') +
       '<div style="margin-top:8px">• <b>Vừa điền xong:</b> mở lại app báo cáo, để yên khoảng <b>1–2 phút</b> cho app gửi hết báo cáo lên. Trang này tự kiểm lại sau 30 giây' + (lanCho > 1 ? ' (đã kiểm ' + lanCho + ' lần)' : '') + '.<br>' +
       '• <b>Chưa điền:</b> mở app, làm báo cáo cho lượt trên rồi quay lại đây.<br>' +
       '• <b>Bấm nhầm khách / check-in thử / bấm trùng:</b> chọn lý do rồi bấm <b>Bỏ lượt</b> (tối đa 2 lượt/ngày). Ảnh gửi nhóm sẽ ghi rõ lượt bạn tự bỏ. Gặp khách mà khách vắng thì KHÔNG bỏ: làm báo cáo chọn "CHƯA GẶP ĐƯỢC".</div>' +
       '<div style="margin-top:6px">Đã có ' + ds.length + ' báo cáo · check-in ' + dem.ck + ' lượt.</div>';
     if (lanCho <= 40) CHO_HEN = setTimeout(kiemLai, 30000);
     return;
   }
   CHO_LAN = 0;
   if (!ds.length) { $('tb').innerHTML = 'Ngày <b>' + dd(ngay) + '</b> chưa có báo cáo nào' + (dem && dem.ck ? ' (đã check-in <b>' + dem.ck + '</b> lượt)' : '') + '. Làm báo cáo trên app xong rồi bấm ↻.'; return; }
   var the_ = ds.map(function (o, i) { return the(o, i + 1); });
   var trong = the_.reduce(function (s, x) { return s + x.trong; }, 0), soAnh = Math.ceil(ds.length / MOI_ANH);
   var dsMoi = ds.filter(function (o) { return o.moi === 'MOI' || o.moi === 'THANG'; });   // Chị 11/11: tính theo LẦN ĐẦU GẶP TRONG THÁNG   // 11/11 Chị: ghi số + TÊN khách gặp lần đầu để làm việc với NV
   if (dsMoi.length) doiChieu += (doiChieu ? '<br>' : '') + 'Khách gặp lần đầu trong tháng: ' + dsMoi.length + ' — ' + dsMoi.map(function (o) { return esc(o['TÊN ĐẠI LÝ'] || o['SỐ ĐIỆN THOẠI']); }).join(', ');
   var khuon = '';
   for (var p = 0; p < soAnh; p++) {
     khuon += '<div class="anh" id="anh' + p + '"><div class="top"><h2>BÁO CÁO KẾT QUẢ NGÀY ' + dd(ngay) + ' · ' + esc(d.ten).toUpperCase() + '</h2>' +
       (doiChieu ? '<div class="' + (dem.chuaBC ? 'trd' : '') + '"><b>' + doiChieu + '</b></div>' : '') +
       '<div>' + CTY + ' · ' + ds.length + ' lượt ghé · ' + trong + ' ô bỏ trống · Ảnh ' + (p + 1) + '/' + soAnh + '</div></div>' +
       the_.slice(p * MOI_ANH, (p + 1) * MOI_ANH).map(function (x) { return x.html; }).join('') +
       '<div class="chan">Xuất từ app báo cáo lúc ' + new Date().toLocaleString('vi-VN') + '</div></div>';
   }
   $('khuon').innerHTML = khuon;
   $('tb').innerHTML = (doiChieu ? '<div' + (dem.chuaBC ? ' class="loi"' : '') + '>' + doiChieu + '</div>' : '') + '<b>' + ds.length + ' khách</b> · ' + soAnh + ' ảnh' + (trong ? ' · <span class="loi">' + trong + ' ô bỏ trống</span>' : ' · đủ hết các ô') + '. Đang dựng ảnh…';
   dungAnh(0, soAnh, ngay, DANG);
 }

 /** 10/11: ảnh KẾ HOẠCH CÔNG VIỆC — mỗi việc: tên việc · gặp ai · nội dung · mục tiêu. Ngày đã qua/hôm nay: kèm trạng thái theo lượt ghé thật. */
 function veKH(d, ngay) {
   var kh = d.kh || [], dk = d.dcKH, daQua = ngay <= homNay();
   VIEC = kh; if (d.goiY && d.goiY.length) dl('dlKhach', d.goiY);
   $('oKq').style.display = daQua ? 'block' : 'none';
   if (!SUA) $('nhapTD').textContent = '➕ Thêm việc ngày ' + dd(ngay);
   $('dsViec').innerHTML = kh.map(function (o, i) {
     return '<div class="viec"><div><b>' + (i + 1) + '. ' + esc(o.ten || o.nd) + '</b>' + (o.khach ? ' · ' + esc(o.khach) : '') + (o.mt ? '<br><small>Mục tiêu: ' + esc(o.mt) + '</small>' : '') + (daQua && o.tt ? '<br><small><b>' + esc(o.tt) + '</b>' + (o.kq ? ' · ' + esc(o.kq) : '') + '</small>' : '') + '</div>' +
       '<button onclick="suaViec(' + i + ')">Sửa</button><button onclick="xoaViec(' + i + ')">Xoá</button></div>';
   }).join('');
   if (!kh.length) { $('tb').innerHTML = 'Ngày <b>' + dd(ngay) + '</b> chưa có việc nào. Điền ô bên trên rồi bấm <b>LƯU VIỆC</b>; lưu xong ảnh kế hoạch tự hiện để gửi nhóm.'; return; }
   var MOI = 4, soAnh = Math.ceil(kh.length / MOI), khuon = '';
   var the_ = kh.map(function (o, i) {
     var tt = daQua && o.tt ? '<span class="tt ' + (/^ĐÃ/.test(o.tt) ? 'ok' : 'chua') + '">' + esc(o.tt) + '</span>' : '';
     var dong = [['Gặp ai', o.khach], ['Nội dung', o.nd], ['Mục tiêu', o.mt]].concat(o.kq ? [['Kết quả', o.kq]] : [])
       .filter(function (m) { return m[1]; }).map(function (m) { return '<tr><th>' + m[0] + '</th><td>' + esc(m[1]) + '</td></tr>'; }).join('');
     return '<div class="the"><div class="dau"><b>' + (i + 1) + '. ' + esc(o.ten || o.khach || 'Công việc') + '</b>' + tt + '</div><table>' + dong + '</table></div>';
   });
   var tom = daQua && dk ? 'Kế hoạch ' + dk.tong + ' việc · đã làm ' + dk.daLam + ' · chưa làm ' + dk.chua + ' · phát sinh ' + dk.phatSinh.length : kh.length + ' việc';
   var ps = daQua && dk && dk.phatSinh.length ? '<div class="the"><div class="dau"><b>Phát sinh ngoài kế hoạch</b></div><div class="dc">' + dk.phatSinh.map(esc).join(' · ') + '</div></div>' : '';
   for (var p = 0; p < soAnh; p++) {
     khuon += '<div class="anh" id="anh' + p + '"><div class="top"><h2>KẾ HOẠCH NGÀY ' + dd(ngay) + ' · ' + esc(d.ten).toUpperCase() + '</h2>' +
       '<div><b>' + tom + '</b></div><div>' + CTY + ' · Ảnh ' + (p + 1) + '/' + soAnh + '</div></div>' +
       the_.slice(p * MOI, (p + 1) * MOI).join('') + (p === soAnh - 1 ? ps : '') +
       '<div class="chan">Xuất từ app báo cáo lúc ' + new Date().toLocaleString('vi-VN') + '</div></div>';
   }
   $('khuon').innerHTML = khuon;
   $('tb').innerHTML = '<b>' + tom + '</b> · ' + soAnh + ' ảnh. Đang dựng ảnh…';
   dungAnh(0, soAnh, ngay, DANG);
 }

 /** Dựng lần lượt từng ảnh PNG (để sẵn, bấm GỬI là chia sẻ ngay cả bộ). */
 function dungAnh(p, soAnh, ngay, lan) {
   if (lan !== DANG) return;
   if (p >= soAnh) {
     $('gui').disabled = false; $('gui').textContent = '📤 GỬI ZALO (' + soAnh + ' ảnh)';
     $('tb').innerHTML = $('tb').innerHTML.replace('Đang dựng ảnh…', 'Ảnh đã sẵn sàng. Bấm <b>GỬI ZALO</b> → chọn <b>Zalo</b> → chọn nhóm → Gửi.');
     return;
   }
   html2canvas($('anh' + p), { scale: 2, backgroundColor: '#eef1f4', logging: false }).then(function (cv) {
     cv.toBlob(function (b) {
       if (lan !== DANG) return;
       TEP.push(new File([b], (KH ? 'ke-hoach-' : 'bao-cao-') + ngay + '-' + (p + 1) + '.png', { type: 'image/png' }));
       var im = new Image(); im.src = URL.createObjectURL(b); im.alt = 'Ảnh ' + (p + 1); $('xem').appendChild(im);
       dungAnh(p + 1, soAnh, ngay, lan);
     }, 'image/png');
   }, function () { $('tb').innerHTML = '<span class="loi">Không dựng được ảnh. Bấm ↻ thử lại.</span>'; });
 }

 $('gui').onclick = function () {
   if (!TEP.length) return;
   if (navigator.canShare && navigator.canShare({ files: TEP })) {
     navigator.share({ files: TEP, title: 'Báo cáo ngày' }).catch(function () {});
   } else {
     $('tb').innerHTML = '<span class="loi">Máy này không gửi được nhiều ảnh một lần.</span> Bấm giữ từng ảnh bên dưới → <b>Lưu ảnh</b>, rồi gửi vào nhóm Zalo.';
   }
 };
 tai();
</script>
</body></html>
